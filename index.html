<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryzen Loader — Временно недоступен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0a0a;
        --bg-1: #121212;
        --bg-2: #171717;
        --bg-3: #1f1f1f;
        --bg-4: #262626;

        --border: #232323;
        --border-strong: #333333;
        --border-hover: #3f3f3f;

        --text-1: #fafafa;
        --text-2: #a3a3a3;
        --text-3: #707070;
        --text-4: #484848;

        --green: #22c55e;
        --red: #ef4444;
        --amber: #f59e0b;
        --blue: #3b82f6;

        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --radius-sm: 6px;
        --radius: 8px;
        --radius-lg: 12px;

        --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text-1);
        min-height: 100vh;
        overflow: hidden;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
    }

    /* Subtle grid background */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
        pointer-events: none;
        z-index: 0;
    }

    /* Ambient glow */
    body::after {
        content: '';
        position: fixed;
        top: -40%;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.06) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
        animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
        0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
        50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }

    .container {
        max-width: 560px;
        width: 100%;
        text-align: center;
        position: relative;
        z-index: 1;
        animation: fadeUp 0.7s var(--ease);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ========== LOGO ========== */
    .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
        user-select: none;
    }
    .brand-logo {
        width: 38px; height: 38px;
        border-radius: var(--radius-sm);
        background: var(--text-1);
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 800;
        color: var(--bg);
        font-family: var(--font-mono);
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1; text-align: left; }
    .brand-text .main { font-size: 15px; font-weight: 700; letter-spacing: 2.5px; }
    .brand-text .sub { font-size: 9px; color: var(--text-3); letter-spacing: 2px; margin-top: 4px; font-weight: 500; }

    /* ========== STATUS ICON ========== */
    .status-icon {
        width: 88px; height: 88px;
        border-radius: var(--radius-lg);
        background: var(--bg-1);
        border: 1px solid var(--border-strong);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 32px;
        position: relative;
        animation: pulseGlow 2.6s ease-in-out infinite;
    }
    @keyframes pulseGlow {
        0%, 100% {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
        }
        50% {
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 0 12px rgba(245, 158, 11, 0.03);
        }
    }
    .status-icon svg { width: 38px; height: 38px; color: var(--amber); }
    .status-icon::after {
        content: '';
        position: absolute;
        top: -2px; right: -2px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--amber);
        border: 3px solid var(--bg);
        animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
    }

    /* ========== ERROR CODE ========== */
    .error-code {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--amber);
        background: rgba(245, 158, 11, 0.08);
        border: 1px solid rgba(245, 158, 11, 0.25);
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 20px;
    }
    .error-code .dot {
        width: 5px; height: 5px;
        border-radius: 50%;
        background: var(--amber);
        animation: blink 1.8s ease-in-out infinite;
    }

    /* ========== HEADINGS ========== */
    h1 {
        font-size: clamp(30px, 5.5vw, 46px);
        font-weight: 800;
        letter-spacing: -1.5px;
        line-height: 1.05;
        margin-bottom: 16px;
    }
    h1 .accent { color: var(--text-3); }

    .tagline {
        font-size: 14px;
        color: var(--text-2);
        max-width: 440px;
        margin: 0 auto 40px;
        line-height: 1.65;
    }

    /* ========== QUEUE BOX ========== */
    .queue-box {
        background: var(--bg-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 20px 24px;
        margin-bottom: 20px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 16px;
        align-items: center;
        position: relative;
        overflow: hidden;
    }
    .queue-box::before {
        content: '';
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--amber), transparent);
        animation: scanline 3s linear infinite;
    }
    @keyframes scanline {
        0% { left: -100%; }
        100% { left: 100%; }
    }
    .queue-item { text-align: center; }
    .queue-value {
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: 700;
        color: var(--text-1);
        letter-spacing: -0.5px;
        font-variant-numeric: tabular-nums;
    }
    .queue-value.warn { color: var(--amber); }
    .queue-label {
        font-size: 10px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 600;
        margin-top: 4px;
    }
    .queue-divider {
        width: 1px;
        height: 32px;
        background: var(--border-strong);
    }

    /* ========== LOAD BAR ========== */
    .load-bar-wrap {
        background: var(--bg-1);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
        margin-bottom: 32px;
    }
    .load-bar-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .load-bar-head .label {
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 1.2px;
    }
    .load-bar-head .value {
        color: var(--red);
        font-family: var(--font-mono);
        font-size: 12px;
    }
    .load-bar {
        height: 6px;
        background: var(--bg-3);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
    }
    .load-bar-fill {
        height: 100%;
        width: 97%;
        background: linear-gradient(90deg, var(--amber), var(--red));
        border-radius: 3px;
        position: relative;
        transition: width 2s var(--ease);
    }
    .load-bar-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
        animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    /* ========== ACTIONS ========== */
    .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 36px;
    }
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        padding: 13px 24px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        border-radius: var(--radius);
        transition: all 0.15s var(--ease);
        cursor: pointer;
        border: 1px solid transparent;
        font-family: inherit;
        white-space: nowrap;
    }
    .btn-primary {
        background: var(--text-1);
        color: var(--bg);
        border-color: var(--text-1);
    }
    .btn-primary:hover { background: #d4d4d4; border-color: #d4d4d4; }
    .btn-ghost {
        background: var(--bg-1);
        color: var(--text-1);
        border-color: var(--border-strong);
    }
    .btn-ghost:hover {
        background: var(--bg-2);
        border-color: var(--border-hover);
    }
    .btn svg { width: 15px; height: 15px; }

    /* ========== FOOTER ========== */
    .footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 11px;
        color: var(--text-4);
        font-family: var(--font-mono);
        letter-spacing: 0.3px;
    }
    .footer .dot {
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--text-4);
    }
    .footer .live-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--red);
        animation: blink 1.8s ease-in-out infinite;
    }

    /* ========== FLOATING PARTICLES ========== */
    .particle {
        position: fixed;
        width: 2px;
        height: 2px;
        background: var(--text-4);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
    }

    /* ========== MOBILE ========== */
    @media (max-width: 480px) {
        body { padding: 16px; }
        .brand { margin-bottom: 36px; }
        .status-icon { width: 72px; height: 72px; margin-bottom: 24px; }
        .status-icon svg { width: 30px; height: 30px; }
        h1 { letter-spacing: -1px; }
        .tagline { font-size: 13px; margin-bottom: 32px; }
        .queue-box { padding: 16px 14px; gap: 10px; }
        .queue-value { font-size: 18px; }
        .queue-label { font-size: 9px; letter-spacing: 1px; }
        .btn { padding: 12px 20px; font-size: 12px; flex: 1; min-width: 130px; }
        .actions { flex-direction: column; }
        .footer { font-size: 10px; flex-wrap: wrap; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="brand">
        <div class="brand-logo">R</div>
        <div class="brand-text">
            <span class="main">RYZEN</span>
            <span class="sub">LOADER</span>
        </div>
    </div>

    <div class="status-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
    </div>

    <div class="error-code">
        <span class="dot"></span>
        <span>503 · Service Unavailable</span>
    </div>

    <h1>Сайт временно <span class="accent">недоступен</span></h1>
    <p class="tagline">
        Слишком много посетителей прямо сейчас. Мы уже работаем над расширением мощности — попробуйте зайти через несколько минут.
    </p>

    <div class="queue-box">
        <div class="queue-item">
            <div class="queue-value warn" id="queue-count">—</div>
            <div class="queue-label">В очереди</div>
        </div>
        <div class="queue-divider"></div>
        <div class="queue-item">
            <div class="queue-value" id="queue-wait">~2 мин</div>
            <div class="queue-label">Ожидание</div>
        </div>
    </div>

    <div class="load-bar-wrap">
        <div class="load-bar-head">
            <span class="label">Загрузка сервера</span>
            <span class="value" id="load-value">97%</span>
        </div>
        <div class="load-bar">
            <div class="load-bar-fill" id="load-fill"></div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="retry-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
            </svg>
            Обновить
        </button>
        <a href="https://discord.gg/BMsBuuk2WK" class="btn btn-ghost" target="_blank" rel="noopener">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            Discord
        </a>
    </div>

    <div class="footer">
        <span class="live-dot"></span>
        <span>Все системы перегружены</span>
        <span class="dot"></span>
        <span id="footer-time">—</span>
    </div>
</div>

<script>
/* =========================================================
   QUEUE SIMULATION
   ========================================================= */
const queueCountEl = document.getElementById('queue-count');
const queueWaitEl = document.getElementById('queue-wait');
const loadValueEl = document.getElementById('load-value');
const loadFillEl = document.getElementById('load-fill');
const footerTimeEl = document.getElementById('footer-time');

let queue = 1247;
let load = 97;

function formatNumber(n) {
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function updateQueue() {
    // колеблется вокруг текущего значения
    queue += Math.floor((Math.random() - 0.45) * 40);
    if (queue < 800) queue = 800 + Math.floor(Math.random() * 100);
    if (queue > 1800) queue = 1800 - Math.floor(Math.random() * 100);

    queueCountEl.textContent = formatNumber(queue);

    const waitMin = Math.max(1, Math.round(queue / 600));
    queueWaitEl.textContent = '~' + waitMin + ' мин';

    // загрузка
    load += (Math.random() - 0.5) * 2;
    if (load < 92) load = 92 + Math.random() * 2;
    if (load > 99) load = 99 - Math.random() * 2;
    load = Math.min(99.9, Math.max(92, load));

    const loadStr = load.toFixed(0) + '%';
    loadValueEl.textContent = loadStr;
    loadFillEl.style.width = load.toFixed(1) + '%';
}

updateQueue();
setInterval(updateQueue, 2200);

/* =========================================================
   RETRY
   ========================================================= */
const retryBtn = document.getElementById('retry-btn');
retryBtn.addEventListener('click', () => {
    retryBtn.disabled = true;
    const originalHTML = retryBtn.innerHTML;
    retryBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> Проверяем...';

    setTimeout(() => {
        retryBtn.disabled = false;
        retryBtn.innerHTML = originalHTML;
        // небольшая встряска
        document.querySelector('h1').animate(
            [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
            { duration: 300, easing: 'ease-in-out' }
        );
        updateQueue();
    }, 1400);
});

// inject spin keyframe
const style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);

/* =========================================================
   LIVE CLOCK
   ========================================================= */
function updateTime() {
    const now = new Date();
    footerTimeEl.textContent =
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');
}
updateTime();
setInterval(updateTime, 1000);

/* =========================================================
   AMBIENT PARTICLES
   ========================================================= */
(function spawnParticles() {
    const count = window.innerWidth < 600 ? 14 : 26;
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = Math.random() * 100 + 'vh';
        p.style.opacity = 0.15 + Math.random() * 0.35;
        document.body.appendChild(p);

        const dur = 6000 + Math.random() * 8000;
        const dx = (Math.random() - 0.5) * 80;
        const dy = (Math.random() - 0.5) * 80;

        p.animate([
            { transform: 'translate(0, 0)', opacity: p.style.opacity },
            { transform: `translate(${dx}px, ${dy}px)`, opacity: 0.05 }
        ], {
            duration: dur,
            iterations: Infinity,
            direction: 'alternate',
            easing: 'ease-in-out'
        });
    }
})();

/* =========================================================
   PREVENT ACCIDENTAL NAVIGATION (fake gate)
   ========================================================= */
// ничего не делаем — просто заглушка. Если хочется показать кнопку "войти всё равно", раскомментируй:
/*
retryBtn.addEventListener('dblclick', () => {
    window.location.href = 'index.html';
});
*/
</script>

</body>
</html>
