<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryzen Private — Закрыто</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0a0a;
        --bg-1: #121212;
        --border: #232323;
        --text-1: #fafafa;
        --text-2: #a3a3a3;
        --text-3: #707070;
        --red: #ef4444;
        --font-sans: 'Inter', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text-1);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    .card {
        max-width: 560px;
        width: 100%;
        background: var(--bg-1);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 48px 40px;
        text-align: center;
    }

    .code {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--red);
        text-transform: uppercase;
        margin-bottom: 24px;
    }

    .code::before {
        content: '● ';
        animation: blink 1.2s steps(2) infinite;
    }

    @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
    }

    h1 {
        font-size: clamp(28px, 5vw, 38px);
        font-weight: 800;
        letter-spacing: -1px;
        line-height: 1.15;
        margin-bottom: 16px;
    }

    p {
        font-size: 15px;
        color: var(--text-2);
        margin-bottom: 10px;
    }

    .muted {
        font-size: 12px;
        color: var(--text-3);
        font-family: var(--font-mono);
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
        .card { padding: 36px 24px; }
    }
</style>
</head>
<body>

<div class="card">
    <div class="code">Final Shutdown</div>
    <h1>Сайт больше не работает</h1>
    <p>Маркет обанкротился. Проект Ryzen закрыт окончательно.</p>
    <p>Спасибо всем, кто был с нами.</p>
    <div class="muted">© 2024-2026 Ryzen Private · RIP</div>
</div>

</body>
</html>
