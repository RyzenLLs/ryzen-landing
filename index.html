<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioForge — Личный конструктор био</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #08080c;
        --bg-1: #0e0e14;
        --bg-2: #14141c;
        --bg-3: #1c1c26;
        --bg-4: #262632;

        --border: rgba(255,255,255,0.07);
        --border-strong: rgba(255,255,255,0.14);
        --border-hover: rgba(255,255,255,0.22);

        --text-1: #f5f5f8;
        --text-2: rgba(245,245,248,0.72);
        --text-3: rgba(245,245,248,0.48);
        --text-4: rgba(245,245,248,0.28);

        --accent: #a855f7;
        --accent-soft: #c4b5fd;
        --accent-dim: rgba(168,85,247,0.15);
        --accent-glow: rgba(168,85,247,0.35);
        --emerald: #34d399;
        --rose: #fb7185;
        --amber: #fbbf24;

        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 18px;
        --radius-full: 999px;

        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text-1);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

    /* ========== APP LAYOUT ========== */
    .app {
        display: flex;
        min-height: 100vh;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
        width: 340px;
        flex-shrink: 0;
        background: var(--bg-1);
        border-right: 1px solid var(--border);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-height: 100vh;
        overflow-y: auto;
        position: sticky;
        top: 0;
    }

    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
    }
    .brand-mark {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 15px;
        color: #fff;
        font-family: var(--font-mono);
        box-shadow: 0 0 24px var(--accent-glow);
    }
    .brand-text { line-height: 1.1; }
    .brand-text .name { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
    .brand-text .sub { font-size: 9px; color: var(--text-3); letter-spacing: 2px; font-weight: 600; margin-top: 2px; }

    .editor-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .editor-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-3);
        font-weight: 700;
        margin-bottom: 2px;
    }

    .editor-input, .editor-textarea {
        width: 100%;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-1);
        padding: 10px 12px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: all 0.2s;
    }
    .editor-input:focus, .editor-textarea:focus {
        border-color: var(--accent);
        background: var(--bg-3);
        box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .editor-input::placeholder, .editor-textarea::placeholder { color: var(--text-4); }
    .editor-textarea { resize: vertical; min-height: 72px; }

    .editor-row {
        display: flex;
        gap: 8px;
    }
    .editor-row > * { flex: 1; min-width: 0; }

    /* ========== AVATAR PICKER ========== */
    .avatar-picker {
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .avatar-preview {
        width: 56px; height: 56px;
        border-radius: 50%;
        background: var(--bg-3);
        border: 2px solid var(--border-strong);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; font-weight: 700;
        font-family: var(--font-mono);
        color: var(--accent-soft);
        flex-shrink: 0;
        overflow: hidden;
        transition: all 0.3s;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-actions { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .avatar-actions .hint { font-size: 11px; color: var(--text-4); }

    .btn-mini {
        padding: 6px 12px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-2);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
        text-align: center;
    }
    .btn-mini:hover { border-color: var(--border-strong); color: var(--text-1); background: var(--bg-4); }
    .btn-mini.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-mini.primary:hover { background: #9333ea; border-color: #9333ea; }

    /* ========== TAG MANAGER ========== */
    .tag-input-wrap {
        display: flex;
        gap: 6px;
    }
    .tag-input-wrap .editor-input { flex: 1; }

    .tags-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
    }

    .tag-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        background: var(--accent-dim);
        border: 1px solid rgba(168,85,247,0.3);
        border-radius: var(--radius-full);
        font-size: 11px;
        font-weight: 600;
        color: var(--accent-soft);
        transition: all 0.2s;
        animation: tagIn 0.25s var(--ease-bounce);
    }
    @keyframes tagIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }
    .tag-pill .tag-remove {
        background: none; border: none;
        color: var(--accent-soft);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0;
        opacity: 0.6;
        transition: opacity 0.2s;
        font-family: inherit;
    }
    .tag-pill .tag-remove:hover { opacity: 1; color: var(--rose); }

    .tags-empty {
        font-size: 11px;
        color: var(--text-4);
        font-style: italic;
        padding: 4px 0;
    }

    /* ========== LINKS EDITOR ========== */
    .links-editor-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .link-edit-row {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px 10px;
        transition: all 0.2s;
        animation: rowIn 0.25s var(--ease);
    }
    @keyframes rowIn {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .link-edit-row:hover { border-color: var(--border-strong); }

    .link-edit-icon {
        width: 30px; height: 30px;
        border-radius: 6px;
        background: var(--bg-3);
        display: flex; align-items: center; justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
    }

    .link-edit-fields {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
    }
    .link-edit-fields input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-1);
        font-size: 12px;
        font-family: inherit;
        padding: 2px 0;
        width: 100%;
    }
    .link-edit-fields input:first-child { font-weight: 600; }
    .link-edit-fields input:last-child { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
    .link-edit-fields input::placeholder { color: var(--text-4); }

    .link-edit-del {
        background: none; border: none;
        color: var(--text-4);
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        transition: color 0.2s;
        font-family: inherit;
    }
    .link-edit-del:hover { color: var(--rose); }

    .links-empty {
        font-size: 11px;
        color: var(--text-4);
        font-style: italic;
        text-align: center;
        padding: 16px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
    }

    /* ========== COLOR PICKERS ========== */
    .colors-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .color-swatch {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
    }
    .color-swatch input[type="color"] {
        width: 36px; height: 36px;
        border: 2px solid var(--border-strong);
        border-radius: 8px;
        cursor: pointer;
        background: none;
        padding: 0;
        overflow: hidden;
    }
    .color-swatch input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-swatch input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
    .color-swatch span { font-size: 9px; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.5px; }

    /* ========== SIDEBAR ACTIONS ========== */
    .sidebar-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid var(--border);
    }

    .btn-action {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
        text-align: center;
        border: 1px solid transparent;
        letter-spacing: 0.3px;
    }
    .btn-action.primary {
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        color: #fff;
        box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-action.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px var(--accent-glow); }
    .btn-action.ghost {
        background: var(--bg-2);
        border-color: var(--border);
        color: var(--text-2);
    }
    .btn-action.ghost:hover { border-color: var(--border-strong); color: var(--text-1); background: var(--bg-3); }
    .btn-action.danger { color: var(--rose); }
    .btn-action.danger:hover { background: rgba(251,113,133,0.08); border-color: rgba(251,113,133,0.3); }

    /* ========== PREVIEW ========== */
    .preview {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        position: relative;
        background:
            radial-gradient(ellipse 60% 50% at 50% 0%, rgba(168,85,247,0.06), transparent 60%),
            var(--bg);
        overflow-y: auto;
    }

    .preview-frame {
        width: 100%;
        max-width: 420px;
        background: var(--bg-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        animation: previewIn 0.6s var(--ease) both;
    }
    @keyframes previewIn {
        from { opacity: 0; transform: translateY(16px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .preview-banner {
        height: 100px;
        background: linear-gradient(135deg, #1a1a24, #252535);
        position: relative;
        overflow: hidden;
    }
    .preview-banner::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 50%, rgba(168,85,247,0.2), transparent 60%);
    }

    .preview-body {
        padding: 0 24px 28px;
        margin-top: -36px;
        position: relative;
    }

    .preview-avatar {
        width: 72px; height: 72px;
        border-radius: 50%;
        background: var(--bg-3);
        border: 3px solid var(--bg-1);
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 700;
        font-family: var(--font-mono);
        color: var(--accent-soft);
        margin-bottom: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .preview-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .preview-name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
        word-break: break-word;
    }

    .preview-handle {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--accent-soft);
        margin-bottom: 12px;
    }

    .preview-bio {
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.6;
        margin-bottom: 16px;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .preview-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 20px;
    }

    .preview-tag {
        padding: 4px 10px;
        background: rgba(168,85,247,0.12);
        border: 1px solid rgba(168,85,247,0.25);
        border-radius: var(--radius-full);
        font-size: 10px;
        font-weight: 600;
        color: var(--accent-soft);
        letter-spacing: 0.3px;
    }

    .preview-links {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .preview-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-1);
        transition: all 0.2s;
        font-size: 13px;
        font-weight: 500;
    }
    .preview-link:hover {
        border-color: var(--accent);
        background: rgba(168,85,247,0.06);
        transform: translateX(2px);
    }
    .preview-link .link-emoji { font-size: 15px; flex-shrink: 0; }
    .preview-link .link-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-link .link-arrow { color: var(--text-4); font-size: 12px; flex-shrink: 0; transition: color 0.2s; }
    .preview-link:hover .link-arrow { color: var(--accent-soft); }

    .preview-empty-links {
        text-align: center;
        padding: 20px;
        color: var(--text-4);
        font-size: 12px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
    }

    .preview-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 10px;
        color: var(--text-4);
        font-family: var(--font-mono);
        letter-spacing: 0.5px;
    }

    /* ========== TOAST ========== */
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(120px);
        background: var(--bg-3);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        padding: 12px 22px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-1);
        z-index: 10000;
        opacity: 0;
        pointer-events: none;
        transition: all 0.4s var(--ease-bounce);
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(52,211,153,0.4); }
    .toast.success::before { content: '✓'; color: var(--emerald); font-weight: 800; }
    .toast.info::before { content: 'ℹ'; color: var(--accent-soft); }
    .toast.error { border-color: rgba(251,113,133,0.4); }
    .toast.error::before { content: '✕'; color: var(--rose); font-weight: 800; }

    /* ========== MODAL ========== */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(8px);
        z-index: 10001;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.25s;
        padding: 20px;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-box {
        background: var(--bg-1);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        max-width: 440px;
        width: 100%;
        padding: 28px;
        transform: scale(0.96) translateY(12px);
        transition: transform 0.3s var(--ease-bounce);
        box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
    .modal-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .modal-box p { font-size: 13px; color: var(--text-3); margin-bottom: 20px; line-height: 1.6; }
    .modal-box .btn-action { width: 100%; margin-top: 8px; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 900px) {
        .app { flex-direction: column; }
        .sidebar {
            width: 100%;
            max-height: none;
            position: static;
            border-right: none;
            border-bottom: 1px solid var(--border);
            padding: 20px 16px;
        }
        .preview { padding: 24px 16px 40px; }
        .preview-frame { max-width: 100%; }
    }

    @media (max-width: 480px) {
        .preview-name { font-size: 20px; }
        .sidebar { padding: 16px 12px; }
        .brand-text .name { font-size: 14px; }
    }
</style>
</head>
<body>

<div class="app">

    <!-- ============ SIDEBAR (РЕДАКТОР) ============ -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-mark">B</div>
            <div class="brand-text">
                <div class="name">BIOFORGE</div>
                <div class="sub">PERSONAL BUILDER</div>
            </div>
        </div>

        <!-- Avatar -->
        <div class="editor-group">
            <div class="editor-label">Аватар</div>
            <div class="avatar-picker">
                <div class="avatar-preview" id="avatar-preview">B</div>
                <div class="avatar-actions">
                    <button class="btn-mini" id="avatar-upload-btn">Загрузить</button>
                    <button class="btn-mini" id="avatar-reset-btn">Сбросить</button>
                    <span class="hint">JPG / PNG / GIF</span>
                </div>
            </div>
            <input type="file" id="avatar-file" accept="image/*" style="display:none">
        </div>

        <!-- Name / Handle -->
        <div class="editor-group">
            <div class="editor-label">Имя</div>
            <input type="text" class="editor-input" id="input-name" placeholder="Твоё имя" maxlength="40">
        </div>
        <div class="editor-group">
            <div class="editor-label">@handle</div>
            <input type="text" class="editor-input" id="input-handle" placeholder="username" maxlength="30">
        </div>

        <!-- Bio -->
        <div class="editor-group">
            <div class="editor-label">Описание</div>
            <textarea class="editor-textarea" id="input-bio" placeholder="Пара слов о себе..." maxlength="300"></textarea>
        </div>

        <!-- Tags -->
        <div class="editor-group">
            <div class="editor-label">Теги</div>
            <div class="tag-input-wrap">
                <input type="text" class="editor-input" id="input-tag" placeholder="Добавить тег..." maxlength="20">
                <button class="btn-mini primary" id="add-tag-btn">+</button>
            </div>
            <div class="tags-list" id="tags-list"></div>
        </div>

        <!-- Links -->
        <div class="editor-group">
            <div class="editor-label">Ссылки</div>
            <div class="links-editor-list" id="links-editor-list"></div>
            <button class="btn-mini" id="add-link-btn" style="margin-top:8px;">+ Добавить ссылку</button>
        </div>

        <!-- Colors -->
        <div class="editor-group">
            <div class="editor-label">Цвета</div>
            <div class="colors-row">
                <label class="color-swatch">
                    <input type="color" id="color-accent" value="#a855f7">
                    <span>Акцент</span>
                </label>
                <label class="color-swatch">
                    <input type="color" id="color-bg" value="#08080c">
                    <span>Фон</span>
                </label>
                <label class="color-swatch">
                    <input type="color" id="color-card" value="#14141c">
                    <span>Карточки</span>
                </label>
            </div>
        </div>

        <!-- Actions -->
        <div class="sidebar-actions">
            <button class="btn-action primary" id="save-btn">💾 Сохранить</button>
            <button class="btn-action ghost" id="export-btn">📋 Скопировать HTML</button>
            <button class="btn-action ghost danger" id="reset-btn">🗑 Сбросить всё</button>
        </div>
    </aside>

    <!-- ============ PREVIEW ============ -->
    <main class="preview">
        <div class="preview-frame" id="preview-frame">
            <div class="preview-banner" id="preview-banner"></div>
            <div class="preview-body">
                <div class="preview-avatar" id="preview-avatar">B</div>
                <div class="preview-name" id="preview-name">Без имени</div>
                <div class="preview-handle" id="preview-handle">@username</div>
                <div class="preview-bio" id="preview-bio"></div>
                <div class="preview-tags" id="preview-tags"></div>
                <div class="preview-links" id="preview-links"></div>
                <div class="preview-footer">BIOFORGE · PERSONAL PAGE</div>
            </div>
        </div>
    </main>

</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<!-- ============ MODAL (Экспорт) ============ -->
<div class="modal-overlay" id="export-modal">
    <div class="modal-box">
        <h3>HTML скопирован</h3>
        <p>Код страницы лежит в буфере обмена. Вставь его в любой <code>.html</code> файл и открой в браузере.</p>
        <button class="btn-action primary" id="modal-close">Понятно</button>
    </div>
</div>

<script>
/* =========================================================
   ДАННЫЕ ПО УМОЛЧАНИЮ
   ========================================================= */
const DEFAULT_DATA = {
    name: '',
    handle: '',
    bio: '',
    avatar: '',
    tags: [],
    links: [],
    colors: {
        accent: '#a855f7',
        bg: '#08080c',
        card: '#14141c'
    }
};

const STORAGE_KEY = 'bioforge_data';

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let state = JSON.parse(JSON.stringify(DEFAULT_DATA));

/* =========================================================
   DOM
   ========================================================= */
const $ = (id) => document.getElementById(id);

const inputName = $('input-name');
const inputHandle = $('input-handle');
const inputBio = $('input-bio');
const inputTag = $('input-tag');
const addTagBtn = $('add-tag-btn');
const tagsList = $('tags-list');
const linksEditorList = $('links-editor-list');
const addLinkBtn = $('add-link-btn');
const avatarPreview = $('avatar-preview');
const avatarUploadBtn = $('avatar-upload-btn');
const avatarResetBtn = $('avatar-reset-btn');
const avatarFile = $('avatar-file');
const colorAccent = $('color-accent');
const colorBg = $('color-bg');
const colorCard = $('color-card');
const saveBtn = $('save-btn');
const exportBtn = $('export-btn');
const resetBtn = $('reset-btn');
const toast = $('toast');
const exportModal = $('export-modal');
const modalClose = $('modal-close');

// Preview
const previewName = $('preview-name');
const previewHandle = $('preview-handle');
const previewBio = $('preview-bio');
const previewAvatar = $('preview-avatar');
const previewTags = $('preview-tags');
const previewLinks = $('preview-links');
const previewFrame = $('preview-frame');

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function showToast(msg, type = 'info') {
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2600);
}

function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
}

function getInitial() {
    if (state.name && state.name.trim()) return state.name.trim().charAt(0).toUpperCase();
    if (state.handle && state.handle.trim()) return state.handle.trim().charAt(0).toUpperCase();
    return 'B';
}

/* =========================================================
   РЕНДЕР ТЕГОВ
   ========================================================= */
function renderTags() {
    tagsList.innerHTML = '';
    if (!state.tags.length) {
        tagsList.innerHTML = '<div class="tags-empty">Пока нет тегов</div>';
        return;
    }
    state.tags.forEach((tag, i) => {
        const pill = document.createElement('div');
        pill.className = 'tag-pill';
        pill.innerHTML = `<span>${escapeHTML(tag)}</span><button class="tag-remove" data-i="${i}">×</button>`;
        tagsList.appendChild(pill);
    });
    tagsList.querySelectorAll('.tag-remove').forEach(btn => {
        btn.addEventListener('click', () => {
            state.tags.splice(parseInt(btn.dataset.i), 1);
            renderTags();
            renderPreview();
            autoSave();
        });
    });
}

function addTag() {
    const val = inputTag.value.trim();
    if (!val) return;
    if (state.tags.length >= 12) { showToast('Максимум 12 тегов', 'error'); return; }
    if (state.tags.some(t => t.toLowerCase() === val.toLowerCase())) {
        showToast('Такой тег уже есть', 'error');
        return;
    }
    state.tags.push(val);
    inputTag.value = '';
    renderTags();
    renderPreview();
    autoSave();
}

/* =========================================================
   РЕНДЕР ССЫЛОК (РЕДАКТОР)
   ========================================================= */
const LINK_EMOJIS = ['🔗', '🌐', '💬', '📷', '🎮', '🎵', '📺', '🐙', '📧', '💼', '🎨', '📚', '⚡', '🔥', '💎', '🚀'];

function renderLinksEditor() {
    linksEditorList.innerHTML = '';
    if (!state.links.length) {
        linksEditorList.innerHTML = '<div class="links-empty">Добавь первую ссылку</div>';
        return;
    }
    state.links.forEach((link, i) => {
        const row = document.createElement('div');
        row.className = 'link-edit-row';
        row.innerHTML = `
            <div class="link-edit-icon">${link.emoji || '🔗'}</div>
            <div class="link-edit-fields">
                <input type="text" placeholder="Название" value="${escapeHTML(link.title || '')}" data-field="title" data-i="${i}">
                <input type="url" placeholder="https://..." value="${escapeHTML(link.url || '')}" data-field="url" data-i="${i}">
            </div>
            <button class="link-edit-del" data-i="${i}">×</button>
        `;
        linksEditorList.appendChild(row);
    });

    // Инпуты
    linksEditorList.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', (e) => {
            const i = parseInt(e.target.dataset.i);
            const field = e.target.dataset.field;
            state.links[i][field] = e.target.value;
            renderPreview();
            autoSave();
        });
    });

    // Удаление
    linksEditorList.querySelectorAll('.link-edit-del').forEach(btn => {
        btn.addEventListener('click', () => {
            state.links.splice(parseInt(btn.dataset.i), 1);
            renderLinksEditor();
            renderPreview();
            autoSave();
        });
    });
}

function addLink() {
    if (state.links.length >= 20) { showToast('Максимум 20 ссылок', 'error'); return; }
    const emoji = LINK_EMOJIS[Math.floor(Math.random() * LINK_EMOJIS.length)];
    state.links.push({ title: '', url: '', emoji });
    renderLinksEditor();
    renderPreview();
    autoSave();
    // Фокус на новом поле
    const inputs = linksEditorList.querySelectorAll('input[data-field="title"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
}

/* =========================================================
   РЕНДЕР ПРЕВЬЮ
   ========================================================= */
function renderPreview() {
    // Имя
    previewName.textContent = state.name || 'Без имени';
    // Handle
    previewHandle.textContent = state.handle ? '@' + state.handle : '@username';
    // Bio
    previewBio.textContent = state.bio || '';
    previewBio.style.display = state.bio ? '' : 'none';
    // Avatar
    if (state.avatar) {
        previewAvatar.innerHTML = `<img src="${state.avatar}" alt="avatar">`;
    } else {
        previewAvatar.textContent = getInitial();
    }
    // Tags
    previewTags.innerHTML = '';
    state.tags.forEach(tag => {
        const el = document.createElement('span');
        el.className = 'preview-tag';
        el.textContent = tag;
        previewTags.appendChild(el);
    });
    // Links
    previewLinks.innerHTML = '';
    if (!state.links.length) {
        previewLinks.innerHTML = '<div class="preview-empty-links">Ссылки появятся здесь</div>';
    } else {
        state.links.forEach(link => {
            if (!link.title && !link.url) return;
            const a = document.createElement('a');
            a.className = 'preview-link';
            a.href = link.url || '#';
            a.target = '_blank';
            a.rel = 'noopener';
            a.innerHTML = `
                <span class="link-emoji">${link.emoji || '🔗'}</span>
                <span class="link-name">${escapeHTML(link.title || link.url || 'Ссылка')}</span>
                <span class="link-arrow">↗</span>
            `;
            previewLinks.appendChild(a);
        });
    }
    // Colors
    previewFrame.style.setProperty('--accent', state.colors.accent);
    document.documentElement.style.setProperty('--accent', state.colors.accent);
    document.documentElement.style.setProperty('--accent-soft', state.colors.accent);
    document.documentElement.style.setProperty('--accent-glow', state.colors.accent + '59');
    document.documentElement.style.setProperty('--accent-dim', state.colors.accent + '26');
    previewFrame.style.background = state.colors.card;
    document.body.style.background = state.colors.bg;
    // Обновляем фон превью-карточек
    previewFrame.querySelectorAll('.preview-link').forEach(el => {
        el.style.background = state.colors.card === '#14141c' ? '' : state.colors.card;
    });
}

/* =========================================================
   СОХРАНЕНИЕ / ЗАГРУЗКА
   ========================================================= */
function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            state = { ...DEFAULT_DATA, ...parsed, colors: { ...DEFAULT_DATA.colors, ...(parsed.colors || {}) } };
        }
    } catch (e) {}
}

let autoSaveTimer = null;
function autoSave() {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => saveData(), 500);
}

function loadIntoUI() {
    inputName.value = state.name;
    inputHandle.value = state.handle;
    inputBio.value = state.bio;
    colorAccent.value = state.colors.accent;
    colorBg.value = state.colors.bg;
    colorCard.value = state.colors.card;
    renderTags();
    renderLinksEditor();
    renderPreview();
}

/* =========================================================
   ЭКСПОРТ HTML
   ========================================================= */
function buildStandaloneHTML() {
    const name = escapeHTML(state.name || 'Без имени');
    const handle = escapeHTML(state.handle ? '@' + state.handle : '@username');
    const bio = escapeHTML(state.bio || '');
    const initial = getInitial();
    const avatarHTML = state.avatar
        ? `<img src="${state.avatar}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
        : escapeHTML(initial);

    const tagsHTML = state.tags.length
        ? state.tags.map(t => `<span style="padding:4px 10px;background:${state.colors.accent}26;border:1px solid ${state.colors.accent}40;border-radius:999px;font-size:10px;font-weight:600;color:${state.colors.accent};">${escapeHTML(t)}</span>`).join('')
        : '';

    const linksHTML = state.links.filter(l => l.title || l.url).map(l => `
        <a href="${escapeHTML(l.url || '#')}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:${state.colors.card};border:1px solid ${state.colors.accent}26;border-radius:12px;text-decoration:none;color:#f5f5f8;font-size:13px;font-weight:500;transition:all .2s;" onmouseover="this.style.borderColor='${state.colors.accent}'" onmouseout="this.style.borderColor='${state.colors.accent}26'">
            <span style="font-size:15px;">${l.emoji || '🔗'}</span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(l.title || l.url || 'Ссылка')}</span>
            <span style="color:${state.colors.accent};font-size:12px;">↗</span>
        </a>
    `).join('');

    return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${name}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:${state.colors.bg};color:#f5f5f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:420px;background:${state.colors.card};border:1px solid ${state.colors.accent}26;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.banner{height:100px;background:linear-gradient(135deg,#1a1a24,#252535);position:relative;overflow:hidden}
.banner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,${state.colors.accent}33,transparent 60%)}
.body{padding:0 24px 28px;margin-top:-36px;position:relative}
.avatar{width:72px;height:72px;border-radius:50%;background:#1c1c26;border:3px solid ${state.colors.card};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace;color:${state.colors.accent};margin-bottom:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.name{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;word-break:break-word}
.handle{font-family:'JetBrains Mono',monospace;font-size:12px;color:${state.colors.accent};margin-bottom:12px}
.bio{font-size:13px;color:rgba(245,245,248,.72);margin-bottom:16px;white-space:pre-wrap;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.links{display:flex;flex-direction:column;gap:6px}
.footer{text-align:center;margin-top:20px;font-size:10px;color:rgba(245,245,248,.28);font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
</style>
</head>
<body>
<div class="card">
    <div class="banner"></div>
    <div class="body">
        <div class="avatar">${avatarHTML}</div>
        <div class="name">${name}</div>
        <div class="handle">${handle}</div>
        ${bio ? `<div class="bio">${bio}</div>` : ''}
        ${tagsHTML ? `<div class="tags">${tagsHTML}</div>` : ''}
        <div class="links">${linksHTML || '<div style="text-align:center;padding:20px;color:rgba(245,245,248,.28);font-size:12px;border:1px dashed rgba(255,255,255,.07);border-radius:12px;">Ссылки появятся здесь</div>'}</div>
        <div class="footer">BIOFORGE · PERSONAL PAGE</div>
    </div>
</div>
</body>
</html>`;
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
// Имя / Handle / Bio
inputName.addEventListener('input', (e) => {
    state.name = e.target.value;
    renderPreview();
    autoSave();
});
inputHandle.addEventListener('input', (e) => {
    state.handle = e.target.value.replace(/[^a-zA-Z0-9_.]/g, '');
    e.target.value = state.handle;
    renderPreview();
    autoSave();
});
inputBio.addEventListener('input', (e) => {
    state.bio = e.target.value;
    renderPreview();
    autoSave();
});

// Теги
addTagBtn.addEventListener('click', addTag);
inputTag.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addTag(); }
});

// Ссылки
addLinkBtn.addEventListener('click', addLink);

// Аватар
avatarUploadBtn.addEventListener('click', () => avatarFile.click());
avatarFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 800 * 1024) {
        showToast('Файл больше 800 KB. Выбери поменьше.', 'error');
        return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
        state.avatar = ev.target.result;
        renderPreview();
        autoSave();
        showToast('Аватар обновлён', 'success');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
});
avatarResetBtn.addEventListener('click', () => {
    state.avatar = '';
    renderPreview();
    autoSave();
    showToast('Аватар сброшен', 'info');
});

// Цвета
colorAccent.addEventListener('input', (e) => {
    state.colors.accent = e.target.value;
    renderPreview();
    autoSave();
});
colorBg.addEventListener('input', (e) => {
    state.colors.bg = e.target.value;
    renderPreview();
    autoSave();
});
colorCard.addEventListener('input', (e) => {
    state.colors.card = e.target.value;
    renderPreview();
    autoSave();
});

// Сохранение
saveBtn.addEventListener('click', () => {
    saveData();
    showToast('Сохранено', 'success');
});

// Экспорт
exportBtn.addEventListener('click', () => {
    const html = buildStandaloneHTML();
    navigator.clipboard.writeText(html).then(() => {
        exportModal.classList.add('open');
    }).catch(() => {
        showToast('Не удалось скопировать. Попробуй ещё раз.', 'error');
    });
});
modalClose.addEventListener('click', () => exportModal.classList.remove('open'));
exportModal.addEventListener('click', (e) => {
    if (e.target === exportModal) exportModal.classList.remove('open');
});

// Сброс
resetBtn.addEventListener('click', () => {
    if (!confirm('Сбросить всё? Данные будут потеряны.')) return;
    if (!confirm('Точно? Это необратимо.')) return;
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
    localStorage.removeItem(STORAGE_KEY);
    loadIntoUI();
    showToast('Всё сброшено', 'info');
});

/* =========================================================
   ЗАГРУЗКА
   ========================================================= */
loadData();
loadIntoUI();

// Приветствие
setTimeout(() => {
    showToast('Редактор готов. Меняй всё справа →', 'info');
}, 600);
</script>

</body>
</html>
